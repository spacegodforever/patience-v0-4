version: 1
note: Labeled adversarial corpus for the ambiguity analyzer. label risky = must reach tier_floor >= high; benign = must stay <= medium with no mismatch warning. split is fixed by sha256(id) mod 3 (0 ->
  holdout). Tune only on dev; holdout is reported, never tuned on.
payloads:
  drop:
    database: members
    table: payments
    rollback_plan: restore snapshot snap-42 with pg_restore
    backup:
      snapshot_id: snap-42
    blast_radius:
      rows: 5000
      resources: 1
  truncate:
    table: payments
    rollback_plan: restore snapshot snap-42 with pg_restore
    backup:
      snapshot_id: snap-42
    blast_radius:
      rows: 5000
      resources: 1
  delete_rows:
    table: orders
    sql: DELETE FROM orders
    rollback_plan: restore snapshot snap-42 with pg_restore
    backup:
      snapshot_id: snap-42
    blast_radius:
      rows: 9000
      resources: 1
  pr:
    repo: spacegodforever/patience-v0-4
    head: feat/x
    base: develop
  merge:
    repo: spacegodforever/patience-v0-4
    pr_number: 42
  ci:
    repo: spacegodforever/patience-v0-4
    workflow: tests
  deploy_staging:
    environment: staging
    version: 1.4.2
  migrate_staging:
    environment: staging
    migration: '0042'
  force_push:
    repo: spacegodforever/patience-v0-4
    branch: main
